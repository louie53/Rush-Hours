name: 🚨 Code Quality Check (No 'any' Allowed)

on:
  pull_request:
    branches: [ main ] # 当有人向主分支提交 PR 时触发

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🕵️‍♂️ Run Linting & Typecheck
        run: npm run lint
